name: Summarize new pull request reviews

on:
  pull_request_review:
    types: [submitted]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      models: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Summarize the following GitHub pull request review in one paragraph:
            Title: ${{ github.event.pull_request.title }}
            Review body: ${{ github.event.review.body }}

      - name: Comment with AI summary
        run: |
          gh pr comment $PULL_REQUEST_NUMBER --body '${{ steps.inference.outputs.response }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
