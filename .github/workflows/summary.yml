name: Summarize new code updates

on:
  push:
    branches:
      - main

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      models: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare summary content
        id: prepare
        run: echo "## New updates in the repository" > summary.md

      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Summarize the following code changes:
            ${GITHUB_COMMIT_MESSAGE}

      - name: Comment with AI summary
        run: |
          gh issue comment $ISSUE_NUMBER --body '${{ steps.inference.outputs.response }}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}  # Убедитесь, что вы заменили это значение при необходимости
